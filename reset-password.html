<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>伴愈时光 · 设置新密码</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #F9F4E8;
    color: #4A403A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #FFFFFF;
    border: 1px solid #F0E8D4;
    border-radius: 22px;
    padding: 28px 20px;
    box-shadow: 0 8px 24px rgba(122, 85, 0, 0.08);
  }
  h1 { font-size: 24px; font-weight: 800; text-align: center; letter-spacing: 1px; }
  .sub { font-size: 13px; color: #7E6E58; text-align: center; margin-top: 8px; margin-bottom: 20px; line-height: 1.6; }
  label { display: block; font-size: 16px; font-weight: 700; margin: 14px 0 8px; }
  input {
    width: 100%;
    background: #F7F0DF;
    border: 1px solid #E6DCC4;
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 16px;
    color: #4A403A;
    outline: none;
  }
  input:focus { border-color: #9A6B00; }
  button {
    width: 100%;
    margin-top: 20px;
    background: #9A6B00;
    color: #FFFFFF;
    font-size: 17px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    padding: 14px 0;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 16px; font-size: 15px; text-align: center; line-height: 1.6; }
  .err { color: #9E3232; }
  .ok  { color: #2E7D54; font-weight: 700; }
  .hidden { display: none; }
  .brand { text-align: center; font-size: 13px; letter-spacing: 4px; color: #7E6E58; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>设置新密码</h1>
    <p class="sub">设置一个至少 6 位的新密码，之后回 App 用新密码登录</p>

    <p id="status" class="msg">正在验证链接…</p>

    <form id="form" class="hidden" onsubmit="return false">
      <label for="pw">🔒 新密码</label>
      <input id="pw" type="password" placeholder="至少 6 位" autocomplete="new-password" />
      <label for="pw2">🔒 再输一遍</label>
      <input id="pw2" type="password" placeholder="再次输入新密码" autocomplete="new-password" />
      <button id="btn">保存新密码</button>
    </form>

    <p id="msg" class="msg"></p>
    <p class="brand">陪 伴 · 治 愈 · 时 光</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // Supabase 配置：URL 与 anon key 为公开配置（anon key 本就随客户端分发，数据安全由 RLS 保证）
  var SUPABASE_URL = 'https://fpnkctalbiwzlvkynggv.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwbmtjdGFsYml3emx2a3luZ2d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MjYyMjUsImV4cCI6MjEwNTMwMjIyNX0.h9Hc1ccGCtRyV40q55TJ11GiYRrdu4l2OQfsRRqQjEM';

  var $status = document.getElementById('status');
  var $form = document.getElementById('form');
  var $msg = document.getElementById('msg');
  var $btn = document.getElementById('btn');

  function toZh(m) {
    if (!m) return '';
    if (m.indexOf('Password should be at least') >= 0) return '密码至少 6 位';
    if (m.indexOf('rate limit') >= 0 || m.indexOf('Rate limit') >= 0) return '操作太频繁了，请稍后再试';
    if (m.indexOf('Same password') >= 0) return '新密码不能和旧密码相同';
    if (m.indexOf('network') >= 0 || m.indexOf('fetch') >= 0 || m.indexOf('NetworkError') >= 0) return '连接失败，请稍后再试';
    return m;
  }

  // 解析 URL hash 段参数（#access_token=…&refresh_token=…&type=recovery）
  function parseHash() {
    var hash = window.location.hash ? window.location.hash.slice(1) : '';
    var params = {};
    hash.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
    });
    return params;
  }

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, detectSessionInUrl: false }
  });

  (function init() {
    var p = parseHash();
    if (p.error) {
      $status.className = 'msg err';
      $status.textContent = '链接无效或已过期：' + (p.error_description || p.error) + '。请在 App 里重新发起「忘记密码」。';
      return;
    }
    if (p.type !== 'recovery' || !p.access_token || !p.refresh_token) {
      $status.className = 'msg err';
      $status.textContent = '这不是有效的重置链接。请打开重置邮件里的链接，或在 App 里重新发起「忘记密码」。';
      return;
    }
    sb.auth.setSession({ access_token: p.access_token, refresh_token: p.refresh_token })
      .then(function (res) {
        if (res.error) throw res.error;
        $status.classList.add('hidden');
        $form.classList.remove('hidden');
        document.getElementById('pw').focus();
      })
      .catch(function (e) {
        $status.className = 'msg err';
        $status.textContent = '链接验证失败：' + toZh(e.message) + '。请在 App 里重新发起「忘记密码」。';
      });
  })();

  $btn.addEventListener('click', function () {
    var pw = document.getElementById('pw').value;
    var pw2 = document.getElementById('pw2').value;
    $msg.className = 'msg';
    $msg.textContent = '';
    if (!pw || pw.length < 6) { $msg.className = 'msg err'; $msg.textContent = '密码至少 6 位'; return; }
    if (pw !== pw2) { $msg.className = 'msg err'; $msg.textContent = '两次输入的密码不一致'; return; }

    $btn.disabled = true;
    $btn.textContent = '保存中…';
    sb.auth.updateUser({ password: pw })
      .then(function (res) {
        if (res.error) throw res.error;
        $form.classList.add('hidden');
        $msg.className = 'msg ok';
        $msg.innerHTML = '✅ 密码已更新<br/>请回到「伴愈时光」App，用新密码登录。';
      })
      .catch(function (e) {
        $msg.className = 'msg err';
        $msg.textContent = toZh(e.message);
      })
      .finally(function () {
        $btn.disabled = false;
        $btn.textContent = '保存新密码';
      });
  });
</script>
</body>
</html>
